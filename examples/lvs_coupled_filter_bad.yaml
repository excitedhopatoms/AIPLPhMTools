# 故意写错的 LVS spec，用来确认脚本能抓到开路/短路。
#
# 用法：
#   python -m AIPLPhMTools.lvs --component CoupledRingFilter \
#       --spec AIPLPhMTools/examples/lvs_coupled_filter_bad.yaml
#
# 预期：退出码 1，并报告 bottom_bus / top_bus 开路或短路。

layers:
  WG: [1, 0]

nets:
  bottom_bus:
    layer: WG
    ports: [Input, Add]
  top_bus:
    layer: WG
    ports: [Through, Drop]
